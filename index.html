<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ariyan Emon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      text-align: center;
    }

    .tag {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid #333;
      border-radius: 50px;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(48px, 12vw, 96px);
      line-height: 1;
      margin-bottom: 20px;
      letter-spacing: -4px;
    }

    p {
      color: #aaa;
      font-size: 18px;
      line-height: 1.6;
      max-width: 600px;
      margin: 0 auto 32px;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="tag">
      Personal Website
    </div>

    <h1>Ariyan Emon</h1>

    <p>
      Welcome to my personal website.
      This is where I'll share my journey, projects,
      interests and work.
    </p>

    <a href="mailto:your@email.com" class="button">
      Get in Touch
    </a>

  </main>

</body>
</html>
